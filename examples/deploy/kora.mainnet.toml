# Kora RPC - MAINNET Configuration
# App: unruggable

[kora]
rate_limit = 100  # Adjust based on your needs

# Enable authentication (REQUIRED for mainnet)
[kora.auth]
# These will be loaded from environment variables
# API_KEY and HMAC_SECRET must be set in .env

# Redis cache configuration (recommended for production)
[kora.cache]
enabled = false  # Set to true if you have Redis
# url = "redis://localhost:6379"  # Uncomment if using Redis
default_ttl = 300
account_ttl = 60

# Enable/disable specific RPC methods
[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
get_supported_tokens = true
sign_transaction = true
sign_and_send_transaction = true
transfer_transaction = true
get_blockhash = true
get_config = true
get_payer_signer = true

[validation]
max_allowed_lamports = 10000000  # 0.01 SOL max per transaction
max_signatures = 10

# Use Jupiter for REAL price data (mainnet)
price_source = "Jupiter"

# Mainnet programs users can interact with
allowed_programs = [
    "11111111111111111111111111111111",              # System Program
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",   # Token Program
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",  # Token-2022 Program
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",  # Associated Token Program
    "AddressLookupTab1e1111111111111111111111111",   # Address Lookup Table Program
    "ComputeBudget111111111111111111111111111111",   # Compute Budget Program

    # Add more programs as needed:
    # "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4",   # Jupiter Aggregator v6
    # "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc",   # Orca Whirlpool
    # "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8",  # Raydium
]

# Tokens you accept as payment (mainnet mints)
allowed_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC (mainnet)
    # "So11111111111111111111111111111111111111112",  # Wrapped SOL
    # "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",  # USDT
    # "mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So",   # mSOL
    # Add more tokens as needed
]

# SPL tokens accepted for paid transactions (optional)
allowed_spl_paid_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
]

disallowed_accounts = []

# Pricing configuration
[validation.price]
type = "margin"  # Add margin on top of base price
margin = 0.1     # 10% margin (0.1 = 10%, 0.5 = 50%)

# Fee payer policy - what actions can the fee payer perform
# IMPORTANT: Review these carefully for security
[validation.fee_payer_policy]

[validation.fee_payer_policy.system]
allow_transfer = true           # Allow system transfers
allow_assign = true             # Allow account assignments
allow_create_account = true     # Allow creating accounts
allow_allocate = true           # Allow allocating space

[validation.fee_payer_policy.system.nonce]
allow_initialize = true         # Allow nonce account creation
allow_advance = true            # Allow advancing nonce
allow_authorize = true          # Allow changing nonce authority
allow_withdraw = true           # Allow withdrawing from nonce

[validation.fee_payer_policy.spl_token]
allow_transfer = true           # Allow token transfers
allow_burn = false              # Disallow burning fee payer's tokens
allow_close_account = false     # Disallow closing fee payer's accounts
allow_approve = false           # Disallow approving delegates
allow_revoke = true             # Allow revoking delegates
allow_set_authority = false     # Disallow changing authorities
allow_mint_to = false           # Disallow minting
allow_initialize_mint = true    # Allow initializing new mints
allow_initialize_account = true # Allow initializing token accounts
allow_initialize_multisig = true
allow_freeze_account = false    # Disallow freezing
allow_thaw_account = false      # Disallow thawing

[validation.fee_payer_policy.token_2022]
allow_transfer = true
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = true
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = true
allow_initialize_account = true
allow_initialize_multisig = true
allow_freeze_account = false
allow_thaw_account = false

# Token-2022 extension restrictions
[validation.token_2022]
blocked_mint_extensions = [
    # Uncomment to block specific extensions:
    # "confidential_transfer_mint",
    # "transfer_fee_config",
    # "interest_bearing_config",
    # "non_transferable",
    # "permanent_delegate",
    # "transfer_hook",
]
blocked_account_extensions = [
    # Uncomment to block specific extensions:
    # "memo_transfer",
    # "cpi_guard",
    # "immutable_owner",
]

# Prometheus metrics
[metrics]
enabled = true
endpoint = "/metrics"
port = 8080
scrape_interval = 60

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30

# Usage limits (requires Redis)
[kora.usage_limit]
enabled = false  # Set to true if using Redis
# cache_url = "redis://redis:6379"
# max_transactions = 1000
# fallback_if_unavailable = false
